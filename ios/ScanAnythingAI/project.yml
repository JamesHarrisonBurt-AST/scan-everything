name: ScanAnythingAI
options:
  bundleIdPrefix: ai.scananything
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ScanAnythingCore:
    path: ScanAnythingCore
targets:
  ScanAnythingAI:
    type: application
    platform: iOS
    sources:
      - path: ScanAnythingAI
        excludes:
          - Info.plist
          - Config/**
    dependencies:
      - package: ScanAnythingCore
        product: ScanAnythingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.scananything.app
        PRODUCT_NAME: ScanAnythingAI
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ScanAnythingAI/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Scan Anything AI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: false
